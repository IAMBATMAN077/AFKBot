  <h1>🤖 Minecraft AFK Bot</h1>
  <p>A lightweight Mineflayer-based bot that keeps a Minecraft Java server (e.g. Aternos) active by connecting and moving periodically.</p>
  <p>The bot runs as a long-lived Node.js process: <code>npm install</code> then <code>node bot.js</code>. See the <a href="https://github.com/IAMBATMAN077/AFKBot">repository</a> for configuration details.</p>
